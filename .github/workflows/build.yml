name: Build exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install websocket-client pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --clean --name OBSBitrateWidget obs_bitrate_widget.py

      - uses: actions/upload-artifact@v4
        with:
          name: OBSBitrateWidget
          path: dist/OBSBitrateWidget.exe
